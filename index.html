<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hồ sơ cá nhân - friery-anui</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="profile">
      <!-- Ảnh đại diện duy nhất -->
      <img class="avatar" id="avatar" src="content/gallery/clothing-klukai-v0-lm7x6x5084xd1.webp" alt="Avatar" />
      
      <h1 id="name">Friery Anui</h1>
      <input type="text" id="nameInput" style="display: none;" value="Friery Anui" />
      <p id="bio">Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</p>
      <textarea id="bioInput" style="display: none;">Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</textarea>
      <button id="editBtn">Chỉnh sửa</button>
      <button id="saveBtn" style="display: none;">Lưu</button>
    </div>
  </div>

  <script>
    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');
    const avatar = document.getElementById('avatar');
    const name = document.getElementById('name');
    const nameInput = document.getElementById('nameInput');
    const bio = document.getElementById('bio');
    const bioInput = document.getElementById('bioInput');

    editBtn.addEventListener('click', () => {
      name.style.display = 'none';
      nameInput.style.display = 'block';
      bio.style.display = 'none';
      bioInput.style.display = 'block';
      editBtn.style.display = 'none';
      saveBtn.style.display = 'inline-block';
    });

    saveBtn.addEventListener('click', () => {
      name.textContent = nameInput.value;
      bio.textContent = bioInput.value;
      name.style.display = 'block';
      nameInput.style.display = 'none';
      bio.style.display = 'block';
      bioInput.style.display = 'none';
      saveBtn.style.display = 'none';
      editBtn.style.display = 'inline-block';
    });
  </script>
</body>
</html>
