<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hồ sơ cá nhân - Friery Anui</title>
  <link rel="stylesheet" href="main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Thông tin cá nhân -->
    <div class="profile">
      <img class="avatar" id="avatar" src="content/gallery/clothing-klukai-v0-lm7x6x5084xd1.webp" alt="Avatar" />
      <h1>Friery Anui</h1>
      <p>Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</p>
      <button id="changeAvatarButton" class="hidden">Thay avatar</button> <!-- Nút thay avatar -->
    </div>

    <!-- Nút đăng nhập -->
    <button id="loginButton">Đăng nhập quản trị</button>

    <!-- Phần thêm ảnh chỉ hiển thị khi đăng nhập -->
    <div class="gallery-section">
      <h2>Bộ sưu tập ảnh</h2>
      
      <!-- Phần thêm ảnh chỉ hiển thị khi đăng nhập -->
      <div class="add-image-section" id="addImageSection">
        <input type="file" id="imageInput" multiple accept="image/*" />
        <input type="text" id="imageDesc" placeholder="Mô tả ảnh" />
      </div>
      
      <div id="gallery" class="gallery-grid"></div>
    </div>

    <!-- Liên kết xã hội -->
    <div class="social-links">
      <a href="https://www.facebook.com/nhan.12070068" target="_blank">Facebook</a>
      <a href="https://www.youtube.com/@friedrich-re/featured" target="_blank">YouTube</a>
      <a href="https://www.instagram.com/nhandoan106/" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@h.misery" target="_blank">TikTok</a>
    </div>
  </div>

  <script>
    let isOwner = localStorage.getItem('isOwner') === 'true';
    const galleryEl = document.getElementById('gallery');
    const avatar = document.getElementById('avatar');
    const loginButton = document.getElementById('loginButton');
    const changeAvatarButton = document.getElementById('changeAvatarButton');
    const addImageSection = document.getElementById('addImageSection');
    const imageInput = document.getElementById('imageInput');
    const imageDesc = document.getElementById('imageDesc');
    const newAvatarInput = document.createElement('input'); // Tạo input file cho avatar

    // Cập nhật giao diện khi đăng nhập
    function updateOwnerUI() {
      if (isOwner) {
        loginButton.textContent = 'Đăng xuất';
        loginButton.classList.add('visible');
        addImageSection.style.display = 'block'; // Hiển thị phần thêm ảnh khi đăng nhập
        changeAvatarButton.classList.remove('hidden'); // Hiển thị nút thay avatar khi đăng nhập
      } else {
        loginButton.textContent = 'Đăng nhập quản trị';
        loginButton.classList.remove('visible');
        addImageSection.style.display = 'none'; // Ẩn phần thêm ảnh khi chưa đăng nhập
        changeAvatarButton.classList.add('hidden'); // Ẩn nút thay avatar khi chưa đăng nhập
      }
    }

    // Xử lý đăng nhập / đăng xuất
    loginButton.addEventListener('click', () => {
      if (isOwner) {
        isOwner = false;
        localStorage.setItem('isOwner', 'false');
        updateOwnerUI();
      } else {
        const password = prompt('Nhập mật khẩu quản trị:');
        if (password === 'anui2025') {
          isOwner = true;
          localStorage.setItem('isOwner', 'true');
          updateOwnerUI();
        } else {
          alert('Sai mật khẩu!');
        }
      }
    });

    // Hiển thị/ẩn loginButton khi click avatar nếu chưa là owner
    avatar.addEventListener('click', () => {
      if (!isOwner) {
        loginButton.classList.toggle('visible');
        avatar.classList.toggle('active');
      }
    });

    // Thay đổi avatar khi click nút "Thay avatar"
    changeAvatarButton.addEventListener('click', () => {
      newAvatarInput.type = 'file';
      newAvatarInput.accept = 'image/*';
      newAvatarInput.click(); // Mở cửa sổ chọn file
    });

    // Xử lý khi người dùng chọn avatar mới
    newAvatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          avatar.src = event.target.result;
          localStorage.setItem('avatarSrc', event.target.result); // Lưu avatar vào localStorage
        };
        reader.readAsDataURL(file);
      }
    });

    // Hiển thị avatar đã lưu nếu có
    const savedAvatar = localStorage.getItem('avatarSrc');
    if (savedAvatar) {
      avatar.src = savedAvatar;  // Hiển thị lại avatar đã lưu
    }

    // Hàm thêm ảnh vào bộ sưu tập
    function addImageToGallery(src, desc) {
      const container = document.createElement('div');
      container.className = 'gallery-item';
      container.innerHTML = `
        <img src="${src}" alt="${desc}">
        <h4>Ảnh</h4>
        <p>${desc || "Mô tả không có"}</p>
      `;
      galleryEl.appendChild(container);
    }

    // Xử lý khi người dùng thêm ảnh vào bộ sưu tập
    imageInput.addEventListener('change', (event) => {
      Array.from(event.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const description = imageDesc.value || "Không có mô tả";
          addImageToGallery(e.target.result, description);
          imageDesc.value = ""; // Reset mô tả sau khi thêm ảnh
        };
        reader.readAsDataURL(file);
      });
    });

    // Hiển thị lại các ảnh đã lưu vào bộ sưu tập
    function loadGalleryFromLocalStorage() {
      const savedImages = JSON.parse(localStorage.getItem('gallery')) || [];
      savedImages.forEach(img => {
        addImageToGallery(img.src, img.desc);
      });
    }

    // Lưu ảnh vào bộ sưu tập
    function saveToGallery(src, desc) {
      const savedImages = JSON.parse(localStorage.getItem('gallery')) || [];
      savedImages.push({ src, desc });
      localStorage.setItem('gallery', JSON.stringify(savedImages));
    }

    // Xử lý khi người dùng thêm ảnh vào bộ sưu tập
    imageInput.addEventListener('change', (event) => {
      Array.from(event.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const description = imageDesc.value || "Không có mô tả";
          addImageToGallery(e.target.result, description);
          saveToGallery(e.target.result, description); // Lưu vào localStorage
          imageDesc.value = ""; // Reset mô tả sau khi thêm ảnh
        };
        reader.readAsDataURL(file);
      });
    });

    loadGalleryFromLocalStorage();  // Tải ảnh từ localStorage khi trang được load

    updateOwnerUI();
  </script>
</body>
</html>
