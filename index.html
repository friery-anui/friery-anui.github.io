<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hồ sơ cá nhân - friery-anui</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="profile">
      <img class="avatar" id="avatar" src="content/gallery/clothing-klukai-v0-lm7x6x5084xd1.webp" alt="Avatar" />
      <h1>Friery Anui</h1>
      <p>Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</p>
    </div>

    <button id="loginButton">Đăng nhập quản trị</button>
    <button id="editButton" class="no-access">Chỉnh sửa</button>

    <div class="edit-section" id="editSection">
      <label for="newAvatar">Chọn ảnh đại diện mới:</label>
      <input type="file" id="newAvatar" accept="image/*">
      <button onclick="changeAvatar()">Lưu ảnh</button>
      <button onclick="removeAvatar()">Xóa ảnh</button>
    </div>

    <div class="social-links">
      <a href="https://www.facebook.com/nhan.12070068" target="_blank">Facebook</a>
      <a href="https://www.youtube.com/@friedrich-re/featured" target="_blank">YouTube</a>
      <a href="https://www.instagram.com/nhandoan106/" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@h.misery" target="_blank">TikTok</a>
    </div>

    <div class="gallery-section">
      <h2>Bộ sưu tập ảnh</h2>
      <div id="ownerControls" style="display: none;">
        <input type="file" id="imageInput" multiple accept="image/*" />
      </div>
      <div id="gallery" class="gallery-grid"></div>
    </div>
  </div>

  <script>
    let isOwner = localStorage.getItem('isOwner') === 'true';
    let imageCount = 0;
    const galleryEl = document.getElementById('gallery');
    const imageInput = document.getElementById('imageInput');
    const ownerControls = document.getElementById('ownerControls');
    const avatar = document.getElementById('avatar');
    const loginButton = document.getElementById('loginButton');
    const editButton = document.getElementById('editButton');
    const editSection = document.getElementById('editSection');
    const newAvatarInput = document.getElementById('newAvatar');

    function updateOwnerUI() {
      if (isOwner) {
        ownerControls.style.display = 'block';
        editButton.style.display = 'inline-block';
        loginButton.textContent = 'Đăng xuất';
        loginButton.style.visibility = 'visible';
      } else {
        ownerControls.style.display = 'none';
        editButton.style.display = 'none';
        editSection.style.display = 'none';
        loginButton.textContent = 'Đăng nhập quản trị';
        loginButton.style.visibility = 'hidden';
      }
    }

    loginButton.addEventListener('click', () => {
      if (isOwner) {
        isOwner = false;
        localStorage.setItem('isOwner', 'false');
        updateOwnerUI();
      } else {
        const password = prompt('Nhập mật khẩu quản trị:');
        if (password === 'anui2025') {
          isOwner = true;
          localStorage.setItem('isOwner', 'true');
          updateOwnerUI();
        } else {
          alert('Sai mật khẩu!');
        }
      }
    });

    editButton.addEventListener('click', () => {
      editSection.style.display = editSection.style.display === 'block' ? 'none' : 'block';
    });

    function changeAvatar() {
      const file = newAvatarInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          avatar.src = e.target.result;
          localStorage.setItem('avatarSrc', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function removeAvatar() {
      avatar.src = 'content/gallery/clothing-klukai-v0-lm7x6x5084xd1.webp';
      localStorage.removeItem('avatarSrc');
    }

    const savedAvatar = localStorage.getItem('avatarSrc');
    if (savedAvatar) {
      avatar.src = savedAvatar;
    }

    avatar.addEventListener('click', () => {
      if (!isOwner) {
        loginButton.style.visibility = 'visible';
      }
    });

    function addImageToGallery(src, title = "", desc = "") {
      imageCount++;
      const container = document.createElement('div');
      container.className = 'gallery-item';
      if (isOwner) container.classList.add('owner');

      container.innerHTML = `
        <img src="${src}" alt="${title}">
        <h4>Ảnh ${imageCount}</h4>
        <p>${desc || "Tải từ máy người dùng"}</p>
        ${isOwner ? '<button class="delete-btn">Xoá</button>' : ''}
      `;

      if (isOwner) {
        container.querySelector('.delete-btn').addEventListener('click', () => {
          container.remove();
          saveGalleryToStorage();
        });
      }

      container.querySelector('img').addEventListener('click', () => {
        document.querySelectorAll('.gallery-item').forEach(item => item.classList.remove('active'));
        container.classList.add('active');
      });

      galleryEl.appendChild(container);
    }

    imageInput?.addEventListener('change', (event) => {
      const files = event.target.files;
      Array.from(files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          addImageToGallery(e.target.result);
          saveGalleryToStorage();
        };
        reader.readAsDataURL(file);
      });
    });

    function saveGalleryToStorage() {
      const images = [];
      document.querySelectorAll('.gallery-item img').forEach(img => {
        images.push(img.src);
      });
      localStorage.setItem('galleryImages', JSON.stringify(images));
    }

    function loadGalleryFromStorage() {
      const images = JSON.parse(localStorage.getItem('galleryImages') || "[]");
      imageCount = 0;
      images.forEach(src => {
        addImageToGallery(src);
      });
    }

    updateOwnerUI();
    loadGalleryFromStorage();
  </script>
</body>
</html>
