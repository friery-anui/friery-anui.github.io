<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân - friery-anui</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="profile">
      <img class="avatar" src="https://preview.redd.it/clothing-klukai-v0-lm7x6x5084xd1.png?width=500&format=png&auto=webp&s=a28a77b3a2b4ac4b0fdb4b950462df5a9c081a67" alt="Avatar">
      <h1>Friery Anui</h1>
      <p>Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</p>
    </div>

    <div class="social-links">
      <a href="https://www.facebook.com/nhan.12070068" target="_blank">Facebook</a>
      <a href="https://www.youtube.com/@friedrich-re/featured" target="_blank">YouTube</a>
      <a href="https://www.instagram.com/nhandoan106/" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@h.misery" target="_blank">TikTok</a>
    </div>

    <div class="gallery-section">
      <h2>Bộ sưu tập ảnh</h2>

      <!-- Input chọn ảnh -->
      <input type="file" id="imageInput" multiple accept="image/*" />
      <div id="gallery" class="gallery-grid">
        <!-- Hình ảnh sẽ được chèn tự động tại đây bằng JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // Ảnh mặc định có sẵn
    const images = [
      {
        title: "Ảnh 1",
        src: "images/2025-05-01_16.29.23.png",
        desc: "Mô tả ảnh 1"
      },
      {
        title: "Ảnh 2",
        src: "images/2025-05-01_16.28.54.png",
        desc: "Mô tả ảnh 2"
      }
    ];

    const galleryEl = document.getElementById('gallery');
    const imageInput = document.getElementById('imageInput');

    // Hàm thêm ảnh vào gallery
    function addImageToGallery(src, title = "Ảnh từ máy", desc = "Được chọn từ máy tính") {
      const el = document.createElement('div');
      el.className = 'gallery-item';
      el.innerHTML = `
        <img src="${src}" alt="${title}">
        <h4>${title}</h4>
        <p>${desc}</p>
      `;
      galleryEl.appendChild(el);
    }

    // Hiển thị ảnh có sẵn
    images.forEach(img => {
      addImageToGallery(img.src, img.title, img.desc);
    });

    // Sự kiện khi người dùng chọn ảnh từ máy tính
    imageInput.addEventListener('change', (event) => {
      const files = event.target.files;
      Array.from(files).forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          addImageToGallery(e.target.result, `Ảnh ${images.length + index + 1}`, "Tải từ máy người dùng");
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
