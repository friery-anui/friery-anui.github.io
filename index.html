<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân - friery-anui</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .gallery-item {
      position: relative;
      margin-bottom: 16px;
    }
    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: red;
      color: white;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      display: none;
    }
    .owner .delete-btn {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <img class="avatar" src="https://preview.redd.it/clothing-klukai-v0-lm7x6x5084xd1.png?width=500&format=png&auto=webp&s=a28a77b3a2b4ac4b0fdb4b950462df5a9c081a67" alt="Avatar">
      <h1>Friery Anui</h1>
      <p>Xin chào! Tôi là một người yêu công nghệ và sáng tạo nội dung.</p>
    </div>

    <div class="social-links">
      <a href="https://www.facebook.com/nhan.12070068" target="_blank">Facebook</a>
      <a href="https://www.youtube.com/@friedrich-re/featured" target="_blank">YouTube</a>
      <a href="https://www.instagram.com/nhandoan106/" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@h.misery" target="_blank">TikTok</a>
    </div>

    <div class="gallery-section">
      <h2>Bộ sưu tập ảnh</h2>

      <!-- Input chọn ảnh (chỉ chủ mới thấy) -->
      <div id="ownerControls">
        <input type="file" id="imageInput" multiple accept="image/*" />
      </div>

      <div id="gallery" class="gallery-grid"></div>
    </div>
  </div>

  <script>
    // Xác định xem có phải chủ sở hữu không
    const isOwner = true; // Đặt thành false nếu là người xem

    const galleryEl = document.getElementById('gallery');
    const imageInput = document.getElementById('imageInput');
    const ownerControls = document.getElementById('ownerControls');

    // Ẩn input nếu không phải chủ
    if (!isOwner) {
      ownerControls.style.display = 'none';
    }

    let imageCount = 0;

    function addImageToGallery(src, title = "", desc = "") {
      imageCount++;
      const container = document.createElement('div');
      container.className = 'gallery-item';
      if (isOwner) {
        container.classList.add('owner');
      }

      container.innerHTML = `
        <img src="${src}" alt="${title}">
        <h4>Ảnh ${imageCount}</h4>
        <p>${desc || "Tải từ máy người dùng"}</p>
        ${isOwner ? '<button class="delete-btn">Xoá</button>' : ''}
      `;

      // Nút xoá
      if (isOwner) {
        const deleteBtn = container.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => {
          galleryEl.removeChild(container);
        });
      }

      galleryEl.appendChild(container);
    }

    imageInput.addEventListener('change', (event) => {
      const files = event.target.files;
      Array.from(files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          addImageToGallery(e.target.result);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>
</body>
</html>
